services:
  app:
    build: .
    image: fsn:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      NEXT_DIST_DIR: .next-production
      NODE_ENV: development
      APP_ORIGIN: http://localhost:3100
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - snapshots:/app/server/data/snapshots
    read_only: true
    tmpfs:
      - /tmp
      - /app/client/.next-production/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  snapshots:
